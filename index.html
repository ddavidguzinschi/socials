<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="mainBox">
        <div class="pfp">
            <img src="images/avatar-jessica.jpeg" alt="Portrait of Jessica Randall" class="pfp">
        </div>
        <h1 class="User">Jessica Randal</h1>
        <p class="Description">London, United Kingdom</p>
        <p class="about">"Front-end developer and avid reader"</p>
        <nav>
        <div class="button"><a href="#">GitHub</a></div>
        <div class="button"><a href="#">Frontend Mentor</a></div>
        <div class="button"><a href="#">LinkedIn</a></div>
        <div class="button"><a href="#">Twitter</a></div>
        <div class="button"><a href="#">Instagram</a></div>
        </nav>
    </main>
</body>
</html>
